<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon source (full bleed): a plain robe with six linked white sockets. Rendered by scripts/export-app-icons.ts. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2b2219"/>
      <stop offset="0.55" stop-color="#14100c"/>
      <stop offset="1" stop-color="#060504"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8742a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8742a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d4"/>
      <stop offset="0.6" stop-color="#cbbfa8"/>
      <stop offset="1" stop-color="#8f8370"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6f5e" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#5a5044" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="socket" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#9aa5ad"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="520" rx="400" ry="420" fill="url(#aura)"/>

  <!-- Robe: neckline, long sleeves, flared body -->
  <path d="M430 150 Q512 205 594 150 L700 185 Q800 240 862 520 L770 548 L716 340 L748 892 Q512 932 276 892 L308 340 L254 548 L162 520 Q224 240 324 185 Z"
        fill="url(#cloth)" stroke="#3a3128" stroke-width="10" stroke-linejoin="round"/>
  <!-- Neck opening and centre seam -->
  <path d="M430 150 Q512 250 594 150" fill="none" stroke="#3a3128" stroke-width="10" stroke-linecap="round"/>
  <path d="M512 210 L512 900" stroke="#8a7e6b" stroke-width="6" opacity="0.5"/>
  <!-- Soft folds -->
  <path d="M380 420 Q360 650 372 880 L330 876 Q330 640 352 420 Z" fill="url(#fold)"/>
  <path d="M644 420 Q664 650 652 880 L694 876 Q694 640 672 420 Z" fill="url(#fold)"/>
  <!-- Rope belt -->
  <path d="M312 470 Q512 505 712 470" fill="none" stroke="#6d5a42" stroke-width="16" stroke-linecap="round"/>

  <!-- Six linked sockets (2 x 3), snake-linked -->
  <g fill="none" stroke="#f4f1ea" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M440 330 L584 330 L584 560 L440 560 L440 760 L584 760"/>
  </g>
  <g filter="url(#glow)" stroke="#4a4036" stroke-width="8">
    <circle cx="440" cy="330" r="46" fill="url(#socket)"/>
    <circle cx="584" cy="330" r="46" fill="url(#socket)"/>
    <circle cx="584" cy="560" r="46" fill="url(#socket)"/>
    <circle cx="440" cy="560" r="46" fill="url(#socket)"/>
    <circle cx="440" cy="760" r="46" fill="url(#socket)"/>
    <circle cx="584" cy="760" r="46" fill="url(#socket)"/>
  </g>
</svg>
